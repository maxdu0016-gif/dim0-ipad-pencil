name: iOS native CI

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-ci.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-native/ios

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Node for bundled offline app
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Bundle offline app
        working-directory: webui
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npx vite build --config vite.ios-offline.config.ts
          node ../ios-native/scripts/package-offline-web.ts

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify native shell sources are generated
        run: |
          grep -q "Dim0WebAppScreen.swift" Dim0Native.xcodeproj/project.pbxproj
          grep -q "NativePencilWebContainer.swift" Dim0Native.xcodeproj/project.pbxproj
          grep -q "offline-app.html" Dim0Native.xcodeproj/project.pbxproj

      - name: Export generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Dim0Native-xcodeproj
          path: ios-native/ios/Dim0Native.xcodeproj
          if-no-files-found: error

      - name: Build and test
        run: |
          set -o pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["isAvailable"] and device["name"].startswith("iPad")))')"
          xcodebuild test \
            -project Dim0Native.xcodeproj \
            -scheme Dim0Native \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
