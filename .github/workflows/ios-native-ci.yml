name: iOS native CI

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-ci.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-native/ios

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify native shell sources are generated
        run: |
          grep -q "Dim0WebAppScreen.swift" Dim0Native.xcodeproj/project.pbxproj
          grep -q "NativePencilWebContainer.swift" Dim0Native.xcodeproj/project.pbxproj

      - name: Export generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Dim0Native-xcodeproj
          path: ios-native/ios/Dim0Native.xcodeproj
          if-no-files-found: error

      - name: Build and test
        run: |
          set -o pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["isAvailable"] and device["name"].startswith("iPad")))')"
          xcodebuild test \
            -project Dim0Native.xcodeproj \
            -scheme Dim0Native \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath .derived-data \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Export test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dim0Native-test-diagnostics
          path: |
            ios-native/ios/TestResults.xcresult
            ~/Library/Logs/DiagnosticReports/Dim0Native*
          if-no-files-found: warn
