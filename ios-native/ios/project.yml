name: Dim0Native

options:
  bundleIdPrefix: com.dim0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: N9SR79J574

targets:
  Dim0Native:
    type: application
    platform: iOS
    sources:
      - path: ../Dim0Native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dim0.canvas
        PRODUCT_MODULE_NAME: Dim0Native
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "14"
        MARKETING_VERSION: "1.2.0"
    scheme:
      testTargets:
        - Dim0NativeTests

  Dim0NativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Dim0NativeTests
    dependencies:
      - target: Dim0Native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dim0.canvas.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
